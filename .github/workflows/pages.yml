name: Deploy GitHub Pages
on:
  push:
    branches: [develop]
    paths: ['site/**', '.github/workflows/pages.yml', 'Tests/test_site.py', 'Tests/site_interaction.test.js', 'Tests/browser/**', 'package.json', 'package-lock.json', 'playwright.config.js']
  pull_request:
    branches: [develop]
    paths: ['site/**', '.github/workflows/pages.yml', 'Tests/test_site.py', 'Tests/site_interaction.test.js', 'Tests/browser/**', 'package.json', 'package-lock.json', 'playwright.config.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check website
        run: python3 -m unittest discover -s Tests -p test_site.py
      - name: Install browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test website in desktop and mobile browsers
        run: npm run test:site
  upload:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: site
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages

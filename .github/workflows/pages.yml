name: Deploy GitHub Pages
on:
  push:
    branches: [develop]
    paths: ['site/**', '.github/workflows/pages.yml', 'Tests/test_site.py', 'Tests/site_interaction.test.js', 'Tests/browser/**', 'package.json', 'package-lock.json', 'playwright.config.js']
  pull_request:
    branches: [develop]
    paths: ['site/**', '.github/workflows/pages.yml', 'Tests/test_site.py', 'Tests/site_interaction.test.js', 'Tests/browser/**', 'package.json', 'package-lock.json', 'playwright.config.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check website
        run: python3 -m unittest discover -s Tests -p test_site.py
      - name: Install browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test website in desktop and mobile browsers
        run: npm run test:site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

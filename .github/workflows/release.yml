name: Draft preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag name
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected a version tag, e.g. v1.2.3'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || \
            { echo 'Tag must point to a commit reachable from main'; exit 1; }
      - name: Run automated checks
        run: bash scripts/ci-checks.sh
      - name: Build ad-hoc signed preview
        run: bash scripts/build-preview.sh "$RUNNER_TEMP/macutility-preview"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/macutility-preview/MacUtility-preview.zip" \
            --verify-tag --draft --title "$GITHUB_REF_NAME preview" \
            --notes 'Ad-hoc signed preview only; not notarized. Finder App Group provisioning and end-to-end behavior are not verified. Do not distribute as a production release.'
